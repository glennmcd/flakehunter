name: release-please

# Keeps one "release PR" open on main. It bumps the version from the Conventional Commit messages since the last
# release and writes CHANGELOG.md; merging it tags vX.Y.Z and creates the GitHub Release. See docs/releasing.md.
on:
  push:
    branches: [main]

# The Action labels the release PR (an issues call), opens it (pull requests) and pushes the tag (contents).
permissions:
  contents: write
  issues: write
  pull-requests: write

# Runs queue behind each other instead of racing to update the same release PR.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned to a commit, not a tag, because a tag can be moved. Update with `gh api
      # repos/googleapis/release-please-action/git/ref/tags/<tag>`.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # Pull requests and tags made with the built-in token do not start other workflows, so CI would never run on
          # the release PR. A fine-grained token in the RELEASE_PLEASE_TOKEN secret fixes that (docs/releasing.md);
          # without the secret this still works, with the built-in token.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
